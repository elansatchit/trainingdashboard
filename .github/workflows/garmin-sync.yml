name: Garmin Wellness Sync

on:
  schedule:
    - cron: '0 10 * * *'   # 10am UTC = ~6am ET daily
  workflow_dispatch:         # allow manual trigger from Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "garth<0.5" garminconnect psycopg2-binary

      - name: Sync Garmin wellness
        run: python scripts/garmin_sync.py
        env:
          GARMIN_TOKENSTORE: ${{ secrets.GARMIN_TOKENSTORE }}
          GARMIN_EMAIL:      ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD:   ${{ secrets.GARMIN_PASSWORD }}
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
